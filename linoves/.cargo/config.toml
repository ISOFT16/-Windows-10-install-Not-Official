[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# Fixed load address (1 MiB), no position-independent code.
rustflags = ["-C", "relocation-model=static"]
# `cargo run` boots the kernel in QEMU. The serial port is mirrored to this terminal.
runner = ["qemu-system-x86_64", "-m", "128M", "-serial", "stdio", "-kernel"]
