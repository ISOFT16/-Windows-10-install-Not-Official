name: Linoves

permissions:
  contents: write

on:
  push:
    paths:
      - "linoves/**"
      - ".github/workflows/linoves.yml"
  pull_request:
    paths:
      - "linoves/**"
      - ".github/workflows/linoves.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linoves
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and GRUB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools

      - name: Install Rust target
        run: rustup show

      - name: Build (debug and release)
        run: |
          cargo build
          cargo build --release

      - name: Self-tests in QEMU
        run: ./scripts/selftest.sh

      - name: Bootable ISO
        run: ./scripts/make-iso.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linoves
          path: |
            linoves/dist/Linoves.iso
            linoves/target/x86_64-unknown-none/release/linoves

      - name: Read version
        id: ver
        run: |
          echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "codename=$(grep -m1 'pub const CODENAME' src/main.rs | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # Готовый ISO в разделе Releases (удобно скачать, в т.ч. с телефона)
      - name: Publish ISO to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linoves-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.codename }}-build${{ github.run_number }}
          name: Linoves ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.codename }}), сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            **Linoves.iso** — загрузочный образ. Запуск:
            * QEMU: `qemu-system-x86_64 -m 128M -cdrom Linoves.iso`
            * VirtualBox: новая машина «Other / Other (64-bit)», 128 МБ памяти, подключить ISO как CD.
            * Флешка: записать Rufus в режиме DD; в BIOS включить Legacy/CSM.
          files: linoves/dist/Linoves.iso
