name: Сборка APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Тесты MicroOS
        run: python -m unittest -v tests.test_microos

  apk:
    needs: tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a — для телефонов; x86_64 — для проверки в эмуляторе
        arch: [arm64-v8a, x86_64]
    env:
      APP_ANDROID_ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Установка Buildozer
        run: pip install --upgrade buildozer "cython<3.1" setuptools

      - name: Кэш Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ matrix.arch }}-${{ hashFiles('buildozer.spec') }}

      - name: Сборка APK
        run: yes | buildozer -v android debug

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch == 'arm64-v8a' && 'MicroOS-apk' || 'MicroOS-x86_64-test' }}
          path: bin/*.apk

      - name: Публикация релиза (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'arm64-v8a'
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk

  # Windows 7+: папка с MicroOS.exe в ZIP-архиве.
  # Python 3.7: в отличие от 3.8 не требует обновления Windows 7 KB2533623 (AddDllDirectory)
  windows:
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # без видеокарты Kivy показывает окно с ошибкой OpenGL и ждёт нажатия —
      # во время сборки отключаем графику и разбор аргументов Kivy
      KIVY_GL_BACKEND: mock
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
          architecture: ${{ matrix.arch }}

      - name: Установка Kivy и PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Kivy 2.2.1 — последняя версия с готовыми пакетами для Python 3.7 (x64 и x86)
          python -m pip install --only-binary=kivy,kivy-deps.sdl2,kivy-deps.glew,kivy-deps.angle "kivy[base]==2.2.1" "pyinstaller==5.13.2"
          # pywin32 не нужен MicroOS, а его загрузчик ломает запуск на Windows 7
          python -m pip uninstall -y pywin32 pypiwin32 || true

      - name: Тесты на Python 3.7
        run: python -m unittest -v tests.test_microos

      - name: Сборка exe
        timeout-minutes: 15
        run: pyinstaller --noconfirm windows/microos.spec

      - name: Проверка консольной версии
        shell: bash
        run: printf 'uname -a\ncalc 2+2\nshutdown\n' | MICROOS_DISK="$RUNNER_TEMP/disk.json" dist/MicroOS/MicroOS-Console.exe

      - name: Упаковка в ZIP
        shell: pwsh
        run: |
          Copy-Item "windows/README.txt" "dist/MicroOS/README.txt"
          Copy-Item "windows/MicroOS (DirectX).bat" "dist/MicroOS/"
          Compress-Archive -Path dist/MicroOS -DestinationPath "MicroOS-Windows-${{ matrix.arch }}.zip"

      - name: Загрузка ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MicroOS-Windows-${{ matrix.arch }}
          path: MicroOS-Windows-${{ matrix.arch }}.zip

      - name: Публикация релиза (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MicroOS-Windows-${{ matrix.arch }}.zip

  # Выкладывает готовые файлы в раздел Releases (удобно скачивать, в т.ч. с телефона)
  release:
    needs: [apk, windows]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Подготовка файлов
        run: |
          mkdir out
          cp dl/MicroOS-apk/*.apk out/MicroOS-Android.apk
          cp dl/MicroOS-Windows-x64/*.zip out/
          cp dl/MicroOS-Windows-x86/*.zip out/
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MicroOS (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Android:** MicroOS-Android.apk — установить на телефон (Android 7+, 64-бит).
            **Windows 7/8/10/11:** MicroOS-Windows-x64.zip (64-бит) или MicroOS-Windows-x86.zip (32-бит).
            Распакуйте архив и запустите MicroOS.exe. Если не открывается — «MicroOS (DirectX).bat» или MicroOS-Console.exe.
          files: out/*

  # Устанавливает APK в эмулятор Android 15 с 16 КБ страницами памяти
  # и проверяет, что приложение запускается и не вылетает.
  smoke-test:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MicroOS-x86_64-test
          path: apk

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Запуск в эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          script: bash tests/android_smoke.sh

      - name: Лог и скриншот
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: |
            logcat.txt
            screen.png
