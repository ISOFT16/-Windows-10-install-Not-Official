name: RustOS

permissions:
  contents: write

on:
  push:
    paths:
      - "rustos/**"
      - ".github/workflows/rustos.yml"
  pull_request:
    paths:
      - "rustos/**"
      - ".github/workflows/rustos.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rustos
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and GRUB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools

      - name: Install Rust target
        run: rustup show

      - name: Build (debug and release)
        run: |
          cargo build
          cargo build --release

      - name: Self-tests in QEMU
        run: ./scripts/selftest.sh

      - name: Bootable ISO
        run: ./scripts/make-iso.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rustos
          path: |
            rustos/dist/RustOS.iso
            rustos/target/x86_64-unknown-none/release/rustos

      # Готовый ISO в разделе Releases (удобно скачать, в т.ч. с телефона)
      - name: Publish ISO to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rustos-${{ github.run_number }}
          name: RustOS (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            **RustOS.iso** — загрузочный образ. Запуск:
            * QEMU: `qemu-system-x86_64 -m 128M -cdrom RustOS.iso`
            * VirtualBox: новая машина «Other / Other (64-bit)», 128 МБ памяти, подключить ISO как CD.
            * Флешка: записать Rufus в режиме DD; в BIOS включить Legacy/CSM.
          files: rustos/dist/RustOS.iso
